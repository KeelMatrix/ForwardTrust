name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Validate release tag and changelog
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/validate-release.ps1 -ExpectedVersion $version -ExpectedPackageVersion $version -ExpectedTag $env:GITHUB_REF_NAME -ExpectedCommit (git rev-parse HEAD) -RequireIcon
      - name: Restore
        run: dotnet restore KeelMatrix.ForwardTrust.sln --configfile NuGet.config --force
      - name: Audit package vulnerabilities
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-VulnerabilityAudit.ps1 -ReportPath artifacts/vulnerability-audit.json
      - name: Build and test
        run: |
          dotnet build KeelMatrix.ForwardTrust.sln -c Release --no-restore
          dotnet test KeelMatrix.ForwardTrust.sln -c Release --no-build --logger "console;verbosity=minimal"
      - name: Pack exact product
        run: dotnet pack src/KeelMatrix.ForwardTrust/KeelMatrix.ForwardTrust.csproj -c Release --no-build -o artifacts/packages
      - name: Normalize deterministic package archives
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Normalize-PackageArchives.ps1 -PackageDirectory artifacts/packages
      - name: Verify repeated package output
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/Test-PackageReproducibility.ps1 -PackageDirectory artifacts/packages -ExpectedVersion $version
      - name: Validate exact packed artifact set
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/validate-package.ps1 -PackageDirectory artifacts/packages -ExpectedVersion $version -RequireIcon
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: dmitriyzen
      - name: Publish exact package
        run: dotnet nuget push "artifacts/packages/KeelMatrix.ForwardTrust.${GITHUB_REF_NAME#v}.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
